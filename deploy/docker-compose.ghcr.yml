# Pull-based variant for x86_64 hosts (e.g. Oracle E2.1.Micro):
# uses the image CI publishes to GHCR instead of building locally.
# On a 1 GB VM this avoids the build entirely (no OOM risk, ~15 min faster).
#
#   docker compose -f docker-compose.ghcr.yml up -d
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d   # update
#
# NOTE: x86_64 only — CI does not publish ARM images. On A1.Flex use the
# default docker-compose.yml, which builds natively.
#
# Direct-IP mode (no domain yet): port 4000 is exposed on the VM's public IP.
# The Cloudflare->VM hop is unencrypted — fine for testing, switch to the
# tunnel (docker-compose.yml Mode A) before taking real orders.

services:
  api:
    image: ghcr.io/fofana459-2023/revellebeauty-backend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '4000:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
